name: Check static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check content, local links, accessibility, and metadata
        run: python3 scripts/check_site.py
